# Licence and copyright of every file, in the FSFE's REUSE format (https://reuse.software).
# Source files carry their own SPDX header; this covers the files that cannot (Markdown, TOML,
# YAML, scripts with structured help, the design file, images, fonts). `reuse lint` checks it in CI.
# When several annotations match a file, the last one wins.
version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tanki Skin Studio contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["crates/tanki-ui/assets/ChakraPetch-*.ttf", "crates/tanki-ui/assets/OFL-chakrapetch.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2018 The Chakra Petch Project Authors (https://github.com/m4rc1e/Chakra-Petch.git)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["crates/tanki-ui/assets/Inter.ttf", "crates/tanki-ui/assets/OFL-inter.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2020 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["crates/tanki-ui/assets/JetBrainsMono.ttf", "crates/tanki-ui/assets/OFL-jetbrainsmono.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["crates/tanki-ui/assets/lucide.ttf", "crates/tanki-ui/assets/LICENSE-lucide.txt"]
precedence = "override"
SPDX-FileCopyrightText = [
    "2022 Lucide Contributors",
    "2013-2022 Cole Bemis (portions from Feather)",
]
SPDX-License-Identifier = "ISC"
