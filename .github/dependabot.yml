version: 2
updates:
  # Rust dependencies: one grouped pull request a week, checked by CI.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # New releases wait a week before they are proposed: a compromised one is usually pulled by then.
    cooldown:
      default-days: 7
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # New releases wait a week before they are proposed: a compromised one is usually pulled by then.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
