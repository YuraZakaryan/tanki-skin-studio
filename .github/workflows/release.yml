name: Release

# A push to the `release` branch builds signed downloads and drafts a GitHub Release for the version in
# Cargo.toml; a person reviews and publishes it (docs/releasing.md). Builds there fail without the
# signing secrets of the `release` environment; a manual run without them builds unsigned. A manual run can name a test
# version such as 0.2.0-rc.1. A pull request that touches packaging builds the downloads without
# drafting anything, so packaging is checked before it lands.
on:
  push:
    branches: [release]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "CHANGELOG.md"
      - "CHANGELOG.ru.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Release builds start from source every time: no build cache, so nothing cached by another branch
# can reach a published file.

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::not a version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: macOS universal
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    # Signing secrets live in the `release` environment (docs/releasing.md); pull requests build
    # without it, so their downloads are never signed.
    environment: ${{ github.event_name != 'pull_request' && 'release' || '' }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # On the release branch an unsigned build fails here instead of shipping.
      - name: Require signing secrets on the release branch
        if: github.ref == 'refs/heads/release'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::macOS releases must be signed and notarized, but these secrets of the release environment are empty:$missing"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-about@0.9.3
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Build, sign, notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/package.sh --arch universal --version "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/release/*.dmg
          if-no-files-found: error
      - name: Remove temporary keychain
        if: always() && env.MACOS_KEYCHAIN != ''
        run: security delete-keychain "$MACOS_KEYCHAIN" || true

  windows:
    # An installer (.msi, per user) and a portable .zip for each architecture.
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    environment: ${{ github.event_name != 'pull_request' && 'release' || '' }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Require signing secrets on the release branch
        if: github.ref == 'refs/heads/release'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          [ -n "$WINDOWS_CERTIFICATE" ] && exit 0
          missing=""
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_CERT_PROFILE; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Windows releases must be signed: set WINDOWS_CERTIFICATE, or all of the Azure Trusted Signing secrets (missing:$missing), in the release environment"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-about@0.9.3
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build, sign, package
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          # A release exe without its icon fails the build (apps/tanki-studio/build.rs).
          TANKI_REQUIRE_WINRES: "1"
        run: ./packaging/windows/package.ps1 -Arch $env:ARCH -Version $env:VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: |
            dist/release/*.msi
            dist/release/*.zip
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    if: github.event_name != 'pull_request'
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.msi
            dist/*.zip
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          # The version's CHANGELOG sections lead the notes, English then Russian: the app shows the
          # one of its language when it offers the release.
          packaging/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          if gh release view "$tag" --json isDraft --jq .isDraft > is-draft 2>/dev/null; then
            if [ "$(cat is-draft)" != "true" ]; then
              echo "::error::$tag is already published; raise the version in Cargo.toml"
              exit 1
            fi
            echo "Updating the draft $tag: replacing its files"
            # Every old file goes first, so one renamed or dropped since can't linger in the draft.
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done
            gh release upload "$tag" dist/*
            # The notes and title are refreshed too, so a rebuilt draft never keeps stale text.
            gh release edit "$tag" --target "$GITHUB_SHA" --prerelease="$PRERELEASE" \
              --title "Tanki Skin Studio $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          else
            echo "Creating the draft $tag"
            pre=()
            if [ "$PRERELEASE" = "true" ]; then pre=(--prerelease); fi
            gh release create "$tag" dist/* --draft "${pre[@]}" --target "$GITHUB_SHA" \
              --title "Tanki Skin Studio $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
