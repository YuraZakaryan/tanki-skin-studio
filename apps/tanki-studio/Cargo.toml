[package]
name = "tanki-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
name = "tanki_studio"
path = "src/lib.rs"

[[bin]]
name = "tanki-studio"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
sha2.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tanki-core = { path = "../../crates/tanki-core" }
tanki-i18n = { path = "../../crates/tanki-i18n" }
tanki-ui = { path = "../../crates/tanki-ui" }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
rfd = "0.17.2"
image.workspace = true
log = "0.4"

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tanki-testkit = { path = "../../crates/tanki-testkit" }
egui = "0.37.0"
base64.workspace = true
serde_json.workspace = true
egui_kittest = { version = "0.37.0", features = ["eframe"] }
