[workspace]
members = [
    "apps/tanki-studio",
    "apps/tanki-cli",
    "crates/tanki-cache",
    "crates/tanki-pack",
    "crates/tanki-apply",
    "crates/tanki-state",
    "crates/tanki-core",
    "crates/tanki-ui",
    "crates/tanki-i18n",
    "crates/tanki-testkit",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.1.0"
# The oldest Rust the dependencies build with (egui 0.37, sysinfo 0.39); CI checks it.
rust-version = "1.95"
repository = "https://github.com/YuraZakaryan/tanki-skin-studio"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
walkdir = "2"
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
strsim = "0.11"

# GUI dependencies (wgpu, winit, egui) make debug builds huge; line tables keep backtraces useful
# at a fraction of the disk space and link time.
[profile.dev]
debug = "line-tables-only"

# Dependencies (egui, image decoding, hashing) are optimised even in dev builds: the app decodes
# hundreds of textures and draws every frame, and unoptimised they are ten times slower.
[profile.dev.package."*"]
opt-level = 2
