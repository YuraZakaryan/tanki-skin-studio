# The licences of the Rust crates built into the app, collected by `cargo about generate` into
# THIRD-PARTY-LICENSES.html, which every download carries (their MIT, Apache-2.0 and BSD licences
# ask for their notices in every copy, binaries included). The accepted list matches deny.toml.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

# Only what ships: the four release targets, without build-only and test-only crates.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Our own crates are covered by LICENSE (GPL-3.0-or-later).
private = { ignore = true }
