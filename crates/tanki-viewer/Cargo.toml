[package]
name = "tanki-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
description = "A 3D stage for egui: models turned with the mouse, drawn with wgpu only when the view changes (layer 1)."

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = "0.37.0"
egui-wgpu = { version = "0.37.0", default-features = false }
glam = { version = "0.34.1", features = ["bytemuck"] }
tanki-model = { path = "../tanki-model" }

[dev-dependencies]
pollster = "1.0.1"
# The app gets its backends through eframe; headless tests pick theirs here.
wgpu = "30.0.1"
tanki-testkit = { path = "../tanki-testkit" }
