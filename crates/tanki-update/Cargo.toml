[package]
name = "tanki-update"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
description = "Updates from the project's GitHub Releases: check, download, verify, install, restart (layer 1)."

[dependencies]
anyhow.workspace = true
log = "0.4"
semver = "1.0.28"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# TLS through rustls with the system's certificate store (no bundled root list), and the Windows
# proxy settings. `_ring` picks ring as rustls' crypto provider without ureq's bundled roots.
ureq = { version = "3.5.0", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier", "win-system-proxy"] }
