# Dependency policy, checked by `cargo deny check` in CI: known vulnerabilities (RustSec),
# licences, duplicate or wildcard versions, and where crates come from.

[graph]
all-features = true

[advisories]
# Vulnerabilities fail the check anywhere in the tree. "Unmaintained" notices fail only for our own
# direct dependencies: a transitive one (ttf-parser under ab_glyph, zvariant under AccessKit's
# Linux backend) has no fix we can apply and is followed upstream. An ignored advisory is listed
# here with its reason.
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # egui's default fonts (epaint_default_fonts).
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
